{% extends "base.html" %}
{% block title %}Logout - Health Hub{% endblock %}

{% block content %}
<div class="row justify-content-center">
    <div class="col-md-6">
        <div class="card">
            <div class="card-body">
                <h2 class="card-title text-center mb-4">Confirm Logout</h2>
                <p class="text-muted text-center mb-4">
                    Are you sure you want to log out?
                </p>
                
                <form method="post" novalidate>
                    {% csrf_token %}
                    <button type="submit" class="btn btn-danger w-100 mb-3">Logout</button>
                </form>
                
                <div class="text-center">
                    <a href="/" class="text-decoration-none">Cancel</a>
                </div>
            </div>
        </div>
    </div>
</div>
{% endblock %}
