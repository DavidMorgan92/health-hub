<!DOCTYPE html>
<html>
<head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>Reset Password - Health Hub</title>
    <link href="https://cdnjs.cloudflare.com/ajax/libs/bootstrap/5.3.0/css/bootstrap.min.css" rel="stylesheet">
</head>
<body>
    <div class="container mt-5">
        <div class="row justify-content-center">
            <div class="col-md-6">
                <div class="card">
                    <div class="card-body">
                        <h2 class="card-title text-center mb-4">Set New Password</h2>
                        
                        <form method="post" novalidate>
                            {% csrf_token %}
                            
                            <div class="mb-3">
                                <label for="id_password1" class="form-label">New Password</label>
                                <input type="password" class="form-control" name="password1" id="id_password1" required>
                            </div>
                            
                            <div class="mb-3">
                                <label for="id_password2" class="form-label">Confirm Password</label>
                                <input type="password" class="form-control" name="password2" id="id_password2" required>
                            </div>
                            
                            <button type="submit" class="btn btn-primary w-100 mb-3">Set Password</button>
                        </form>
                    </div>
                </div>
            </div>
        </div>
    </div>
    
    <script src="https://cdnjs.cloudflare.com/ajax/libs/bootstrap/5.3.0/js/bootstrap.bundle.min.js"></script>
</body>
</html>
