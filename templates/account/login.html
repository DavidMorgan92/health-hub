{% extends "base.html" %}
{% block title %}Login - Health Hub{% endblock %}

{% block content %}
<div class="row justify-content-center">
    <div class="col-md-6">
        <div class="card">
            <div class="card-body">
                <h2 class="card-title text-center mb-4">Login</h2>
                
                <form method="post" novalidate>
                    {% csrf_token %}
                    {% if redirect_field_value %}
                    <input type="hidden" name="{{ redirect_field_name }}" value="{{ redirect_field_value }}">
                    {% endif %}
                    
                    <div class="mb-3">
                        <label for="id_login" class="form-label">Email or Username</label>
                        <input type="text" class="form-control" name="login" id="id_login" required>
                    </div>
                    
                    <div class="mb-3">
                        <label for="id_password" class="form-label">Password</label>
                        <input type="password" class="form-control" name="password" id="id_password" required>
                    </div>
                    
                    <button type="submit" class="btn btn-primary w-100 mb-3">Sign In</button>
                </form>
                
                <div class="text-center">
                    <p class="mb-2">
                        <a href="{% url 'account_reset_password' %}" class="text-decoration-none">Forgot password?</a>
                    </p>
                    <p>
                        Don't have an account?
                        <a href="{% url 'account_signup' %}{% if redirect_field_value %}?{{ redirect_field_name }}={{ redirect_field_value|urlencode }}{% endif %}" class="text-decoration-none">Sign up</a>
                    </p>
                </div>
            </div>
        </div>
    </div>
</div>
{% endblock %}
