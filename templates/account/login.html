<!DOCTYPE html>
<html>
<head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>Login - Health Hub</title>
    <link href="https://cdnjs.cloudflare.com/ajax/libs/bootstrap/5.3.0/css/bootstrap.min.css" rel="stylesheet">
</head>
<body>
    <div class="container mt-5">
        <div class="row justify-content-center">
            <div class="col-md-6">
                <div class="card">
                    <div class="card-body">
                        <h2 class="card-title text-center mb-4">Login</h2>
                        
                        <form method="post" novalidate>
                            {% csrf_token %}
                            
                            <div class="mb-3">
                                <label for="id_login" class="form-label">Email or Username</label>
                                <input type="text" class="form-control" name="login" id="id_login" required>
                            </div>
                            
                            <div class="mb-3">
                                <label for="id_password" class="form-label">Password</label>
                                <input type="password" class="form-control" name="password" id="id_password" required>
                            </div>
                            
                            <button type="submit" class="btn btn-primary w-100 mb-3">Sign In</button>
                        </form>
                        
                        <div class="text-center">
                            <p class="mb-2">
                                <a href="{% url 'account_reset_password' %}" class="text-decoration-none">Forgot password?</a>
                            </p>
                            <p>
                                Don't have an account? 
                                <a href="{% url 'account_signup' %}" class="text-decoration-none">Sign up</a>
                            </p>
                        </div>
                    </div>
                </div>
            </div>
        </div>
    </div>
    
    <script src="https://cdnjs.cloudflare.com/ajax/libs/bootstrap/5.3.0/js/bootstrap.bundle.min.js"></script>
</body>
</html>
